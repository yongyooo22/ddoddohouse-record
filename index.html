<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17161A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="또또기록">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="우리 모임의 보드게임 · 머더미스터리 · 방탈출 기록장">
  <title>또또하우스 기록장</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/main.js">
  <script type="module" src="/js/main.js"></script>
</head>
<body class="has-tabbar">
  <div class="loadbar" aria-hidden="true"></div>
  <div class="app" id="app">
    <div id="banner" class="banner" role="status" hidden></div>
    <main id="view" class="view" tabindex="-1">
      <div class="boot" aria-live="polite">
        <img class="boot-logo" src="/icon-192.png" alt="" width="72" height="72">
        <p class="boot-text">기록장을 펼치는 중…</p>
      </div>
    </main>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="주요 메뉴" hidden>
    <a class="tab" href="#/" data-tab="home">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h4.5v-5.5h4V20h4.5V9"/></svg>
      <span class="tab-label">홈</span>
    </a>
    <a class="tab" href="#/records" data-tab="records">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a1.5 1.5 0 0 0 1.5 1.5H19V18"/><path d="M9 7.5h6M9 11h4"/></svg>
      <span class="tab-label">기록</span>
    </a>
    <a class="tab tab-add" href="#/new" data-tab="new" aria-label="새 기록">
      <span class="tab-add-btn" aria-hidden="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
    </a>
    <a class="tab" href="#/stats" data-tab="stats">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="5.5" width="3" height="11.5" rx="1"/><rect x="15.5" y="13" width="3" height="4" rx="1"/></svg>
      <span class="tab-label">통계</span>
    </a>
    <a class="tab" href="#/members" data-tab="members">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.3 2.8-5.2 5.5-5.2s4.9 1.9 5.5 5.2"/><circle cx="17" cy="9" r="2.5"/><path d="M16.2 14.3c2.3-.1 3.9 1.4 4.4 4.4"/></svg>
      <span class="tab-label">멤버</span>
    </a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">이 기록장은 자바스크립트가 필요해요.</p></noscript>
</body>
</html>
